[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# One dependency for gpui, gpui-component and the bundled icons. It pins
# the exact gpui build the components were written against.
gpui-kit = "0.9.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

oxicord-ui = { path = "crates/oxicord-ui" }

# Dependencies are rebuilt rarely, so optimizing them is nearly free and
# keeps the debug UI responsive.
[profile.dev.package."*"]
opt-level = 2
