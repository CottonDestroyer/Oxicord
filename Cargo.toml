[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# One dependency for gpui, gpui-component and the bundled icons. It pins
# the exact gpui build the components were written against.
gpui-kit = "0.9.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
bitflags = "2"
emojis = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
notify-rust = "4"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = "1"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
percent-encoding = "2"

oxicord-model = { path = "crates/oxicord-model" }
async-channel = "2"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tracing-subscriber = "0.3"

oxicord-api = { path = "crates/oxicord-api" }
oxicord-browser-login = { path = "crates/oxicord-browser-login" }
oxicord-media = { path = "crates/oxicord-media" }
oxicord-markdown = { path = "crates/oxicord-markdown" }
oxicord-gateway = { path = "crates/oxicord-gateway" }
oxicord-store = { path = "crates/oxicord-store" }
oxicord-settings = { path = "crates/oxicord-settings" }

oxicord-ui = { path = "crates/oxicord-ui" }

# Dependencies are rebuilt rarely, so optimizing them is nearly free and
# keeps the debug UI responsive.
[profile.dev.package."*"]
opt-level = 2
