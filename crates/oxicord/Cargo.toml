[package]
name = "oxicord"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
oxicord-ui.workspace = true
oxicord-api.workspace = true
oxicord-browser-login.workspace = true
oxicord-gateway.workspace = true
oxicord-media.workspace = true
oxicord-voice.workspace = true
oxicord-model.workspace = true
oxicord-settings.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
async-channel.workspace = true
dirs.workspace = true
notify-rust.workspace = true
keyring.workspace = true
# Compiles Discord's icons and font into the executable.
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Reads the push to talk key while another program has the focus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
